# Single flat config — all defaults in one place, no group composition needed.
# Pass with --config-name first_try on any script.

ward:
  name: ward3
  ward_label: "Ward 3"
  raw_311:
    - data/311_data/ward3_potholes_2023.parquet
  weather_cache: data/weather_cache/weather_ward3_20221201_20231231.parquet

features:
  d: 5     # forecast horizon (days)
  d_p: 14  # precipitation rolling window
  l_p: 5   # precipitation lag
  d_s: 14  # snowfall rolling window
  l_s: 5   # snowfall lag
  d_f: 14  # freeze-thaw rolling window
  l_f: 5   # freeze-thaw lag
  k_AR: 0  # autoregressive lags (0 = non-autoregressive)

model:
  _target_: modeling.models.glm.NegBinGLM
  alpha: 1.0

split:
  random_state: 42
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15

load_model: null

debug:
  verbose: false
  dry_run: false
  inspect: null
