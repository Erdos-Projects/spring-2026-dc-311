name: erdos_ds_environment
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12.12
  - pandas=3.0.0
  - numpy=2.3.5
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - statsmodels=0.14.6
  - scikit-learn=1.8.0
  - shap=0.50.0
  - xgboost=2.1.4
  - lightgbm
  - optuna
  - joblib=1.5.3
  - pyyaml=6.0.3
  - ipython=9.9.0
  - pip
  - pip:
    - hydra-core==1.3.2
    - omegaconf==2.3.0
    - openmeteo-requests==1.7.5
    - requests-cache==1.3.0
    - retry-requests==2.0.0
